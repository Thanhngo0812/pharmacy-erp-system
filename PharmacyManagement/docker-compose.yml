services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db_httt
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db_httt:5432/PharmacyManagement?stringtype=unspecified
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    restart: always

  db_httt:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=PharmacyManagement
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - ./csdl_postgres.sql:/docker-entrypoint-initdb.d/csdl_postgres.sql
      - postgres_data_HTTT:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data_HTTT:
  redis_data:
